<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .tab-button {
            transition: all 0.2s;
        }
        .tab-button:hover {
            background-color: #f3f4f6;
        }
        .tab-button.active {
            background-color: #3b82f6;
            color: white;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .notification.success {
            background-color: #10b981;
            color: white;
        }
        .notification.error {
            background-color: #ef4444;
            color: white;
        }
        td {
            cursor: pointer;
            position: relative;
        }
        .table-container {
            overflow-x: auto;
            overflow-y: visible;
        }
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .table-container {
                margin: 0 -1rem;
                padding: 0 1rem;
            }
            td, th {
                min-width: 100px;
                font-size: 14px;
            }
            h1 {
                font-size: 1.5rem !important;
            }
            h2 {
                font-size: 1.25rem !important;
            }
        }

        @media (max-width: 640px) {
            td, th {
                min-width: 80px;
                font-size: 13px;
                padding: 8px !important;
            }
            .tab-button {
                font-size: 14px;
                padding: 8px 12px !important;
            }
            button {
                padding: 10px 16px !important;
            }
            input[type="password"],
            input[type="text"] {
                font-size: 16px !important; /* Prevents zoom on iOS */
            }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div x-data="dashboardApp()" x-init="init()">
        <!-- Login Screen -->
        <div x-show="!isAuthenticated" class="flex items-center justify-center min-h-screen">
            <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
                <h1 class="text-3xl font-bold mb-4 text-center">Secure Dashboard</h1>
                <p class="text-gray-600 mb-6 text-center">Enter your password to access the dashboard</p>

                <!-- Current File Display -->
                <div x-show="currentFileName" class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
                    <p class="text-xs text-blue-600 font-semibold mb-1">Active File:</p>
                    <p class="text-sm text-blue-900 break-all" x-text="currentFileName"></p>
                </div>

                <form @submit.prevent="login()">
                    <input type="password"
                           x-model="passwordInput"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4"
                           placeholder="Enter password"
                           required>

                    <button type="submit"
                            class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition mb-3">
                        Unlock Dashboard
                    </button>

                    <button type="button"
                            @click="selectDifferentFile()"
                            class="w-full bg-gray-600 text-white py-3 px-4 rounded-lg hover:bg-gray-700 transition">
                        Change File
                    </button>
                </form>

                <div id="browserInfo" class="mt-6 p-4 bg-gray-50 rounded-lg text-sm text-gray-600">
                    <p x-text="browserInfo"></p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div x-show="isAuthenticated" x-cloak>
            <!-- Header -->
            <header class="bg-white shadow">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h1 class="text-2xl font-bold text-gray-900">Dashboard</h1>
                        <div class="flex flex-wrap gap-2 sm:gap-4 items-center w-full sm:w-auto">
                            <span class="text-sm text-gray-600 whitespace-nowrap">
                                Auto-lock in <span x-text="timeUntilLock"></span>
                            </span>
                            <button @click="changeFile()"
                                    class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition text-sm sm:text-base">
                                Change File
                            </button>
                            <button @click="logout()"
                                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm sm:text-base">
                                🔒 Logout
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <!-- Tabs -->
                <div class="mb-6 flex gap-2 flex-wrap">
                    <template x-for="tab in data.tabs" :key="tab.id">
                        <button @click="activeTabId = tab.id"
                                :class="activeTabId === tab.id ? 'active' : ''"
                                class="tab-button px-6 py-2 rounded-lg bg-white shadow"
                                x-text="tab.name">
                        </button>
                    </template>
                </div>

                <!-- No tabs message -->
                <div x-show="!data.tabs || data.tabs.length === 0"
                     class="bg-white rounded-lg shadow p-12 text-center text-gray-500">
                    <p class="text-xl">No data to display</p>
                    <p class="mt-2">Use the Admin Panel to add content</p>
                </div>

                <!-- Table -->
                <template x-for="tab in data.tabs" :key="tab.id">
                    <div x-show="activeTabId === tab.id" class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-2xl font-bold mb-6" x-text="tab.name"></h2>

                        <!-- No data message -->
                        <div x-show="!tab.rows || tab.rows.length === 0"
                             class="text-center py-12 text-gray-500">
                            <p>No data in this tab</p>
                        </div>

                        <!-- Data table -->
                        <div x-show="tab.rows && tab.rows.length > 0" class="table-container">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr class="bg-gray-50">
                                        <template x-for="column in tab.columns" :key="column">
                                            <th class="px-4 py-3 text-left border-b-2 border-gray-300 font-semibold text-gray-700"
                                                x-text="column">
                                            </th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(row, rowIndex) in tab.rows" :key="rowIndex">
                                        <tr class="border-b hover:bg-gray-50">
                                            <template x-for="column in tab.columns" :key="column">
                                                <td class="px-4 py-3"
                                                    @click="copyToClipboard(row[column], column)">
                                                    <!-- URL field -->
                                                    <template x-if="getColumnType(tab, column) === 'url' && row[column]">
                                                        <a :href="row[column]"
                                                           target="_blank"
                                                           class="text-blue-600 hover:underline"
                                                           @click.stop
                                                           x-text="row[column]">
                                                        </a>
                                                    </template>

                                                    <!-- Text and Password fields (displayed as plain text) -->
                                                    <template x-if="getColumnType(tab, column) !== 'url' || !row[column]">
                                                        <span x-text="row[column]"></span>
                                                    </template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-4 text-xs sm:text-sm text-gray-600 text-center sm:text-left">
                            <p>💡 Click any cell to copy its value to clipboard</p>
                        </div>
                    </div>
                </template>
            </main>
        </div>
    </div>

    <script>
        // ============================================================================
        // ENCRYPTION MANAGER (Same as admin.html)
        // ============================================================================
        class EncryptionManager {
            // PBKDF2 iterations (OWASP-recommended minimum).
            static ITERATIONS = 600000;

            static async encrypt(data, password) {
                try {
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const key = await this.deriveKey(password, salt);
                    const jsonString = JSON.stringify(data);
                    const encoder = new TextEncoder();
                    const dataBuffer = encoder.encode(jsonString);
                    const encryptedBuffer = await crypto.subtle.encrypt(
                        { name: 'AES-GCM', iv: iv },
                        key,
                        dataBuffer
                    );
                    const encryptedArray = new Uint8Array(encryptedBuffer);
                    const combined = new Uint8Array(salt.length + iv.length + encryptedArray.length);
                    combined.set(salt, 0);
                    combined.set(iv, salt.length);
                    combined.set(encryptedArray, salt.length + iv.length);
                    return btoa(String.fromCharCode(...combined));
                } catch (error) {
                    console.error('Encryption error:', error);
                    throw new Error('Encryption failed');
                }
            }

            static async decrypt(encryptedString, password) {
                try {
                    // Decode base64 and split into salt, IV, and ciphertext
                    const combined = Uint8Array.from(atob(encryptedString), c => c.charCodeAt(0));
                    const salt = combined.slice(0, 16);
                    const iv = combined.slice(16, 28);
                    const encryptedData = combined.slice(28);

                    const key = await this.deriveKey(password, salt);
                    const decryptedBuffer = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: iv },
                        key,
                        encryptedData
                    );
                    const decoder = new TextDecoder();
                    return JSON.parse(decoder.decode(decryptedBuffer));
                } catch (error) {
                    console.error('Decryption error:', error);
                    // AES-GCM throws OperationError on a wrong password
                    if (error.name === 'OperationError' || (error.message && error.message.includes('operation-specific reason'))) {
                        throw new Error('Wrong password');
                    }
                    throw new Error('Decryption failed');
                }
            }

            static async deriveKey(password, salt, iterations = EncryptionManager.ITERATIONS) {
                const encoder = new TextEncoder();
                const passwordBuffer = encoder.encode(password);
                const passwordKey = await crypto.subtle.importKey(
                    'raw',
                    passwordBuffer,
                    'PBKDF2',
                    false,
                    ['deriveBits', 'deriveKey']
                );
                return await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: iterations,
                        hash: 'SHA-256'
                    },
                    passwordKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            }
        }

        // ============================================================================
        // FILE SYSTEM MANAGER (Same as admin.html)
        // ============================================================================
        class FileSystemManager {
            static isFileSystemAccessSupported() {
                return 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
            }

            static getBrowserType() {
                const ua = navigator.userAgent;
                if (ua.includes('Edg/')) return 'edge';
                if (ua.includes('Chrome') && !ua.includes('Edg/')) return 'chrome';
                if (ua.includes('Firefox')) return 'firefox';
                if (ua.includes('Safari') && !ua.includes('Chrome')) return 'safari';
                return 'unknown';
            }

            static getBrowserInfo() {
                const browser = this.getBrowserType();
                const isSupported = this.isFileSystemAccessSupported();
                if (isSupported) {
                    return `${browser.charAt(0).toUpperCase() + browser.slice(1)} detected: Select your data file once, it will be remembered.`;
                } else {
                    return `${browser.charAt(0).toUpperCase() + browser.slice(1)} detected: You'll need to select your data file each time.`;
                }
            }
        }

        // ============================================================================
        // INDEXEDDB HELPER (Same as admin.html)
        // ============================================================================
        class IndexedDBHelper {
            static async openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('DashboardDB', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files');
                        }
                    };
                });
            }

            static async storeFileHandle(fileHandle) {
                const db = await this.openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.put(fileHandle, 'dataFileHandle');
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            }

            static async getStoredFileHandle() {
                try {
                    const db = await this.openDB();
                    return new Promise((resolve, reject) => {
                        const transaction = db.transaction(['files'], 'readonly');
                        const store = transaction.objectStore('files');
                        const request = store.get('dataFileHandle');
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => resolve(request.result);
                    });
                } catch (error) {
                    return null;
                }
            }

            static async clearFileHandle() {
                const db = await this.openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(['files'], 'readwrite');
                    const store = transaction.objectStore('files');
                    const request = store.delete('dataFileHandle');
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            }
        }

        // ============================================================================
        // DATA FILE MANAGER (Same as admin.html)
        // ============================================================================
        class DataFileManager {
            constructor() {
                // If the newer picker failed in this browser before, go straight to the standard chooser
                let pickerBroken = false;
                try { pickerBroken = localStorage.getItem('pickerBroken') === '1'; } catch (e) {}
                this.isModernBrowser = FileSystemManager.isFileSystemAccessSupported() && !pickerBroken;
                this.fileHandle = null;
            }

            async init() {
                if (this.isModernBrowser) {
                    // Only load the remembered handle here. Asking for permission
                    // needs a click, so that happens later in readData().
                    try {
                        this.fileHandle = (await IndexedDBHelper.getStoredFileHandle()) || null;
                    } catch (error) {
                        this.fileHandle = null;
                    }
                }
            }

            async verifyPermission(fileHandle) {
                const options = { mode: 'read' };
                try {
                    if ((await fileHandle.queryPermission(options)) === 'granted') {
                        return true;
                    }
                    if ((await fileHandle.requestPermission(options)) === 'granted') {
                        return true;
                    }
                } catch (error) {
                    console.error('Permission error:', error);
                }
                return false;
            }

            async selectDataFile() {
                let fileHandle;
                try {
                    [fileHandle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'Dashboard Data',
                            accept: {'text/javascript': ['.js']}
                        }],
                        multiple: false
                    });
                } catch (error) {
                    // User closed the picker (Chrome also reports blocked picks this way)
                    if (error.name === 'AbortError') {
                        console.warn('File picker closed or aborted:', error.message);
                        // Some Chrome setups abort even after a file is chosen.
                        // Switch to the standard file chooser for the rest of this visit.
                        this.isModernBrowser = false;
                        this.pickerFailed = true;
                        // Remember this so later visits skip the broken picker
                        try { localStorage.setItem('pickerBroken', '1'); } catch (e) {}
                        return null;
                    }
                    console.error('File selection error:', error);
                    // Browser blocked the picker (usually after a permission prompt used up the click)
                    throw new Error('Could not open the file picker. Click "Change File", pick data.js, then unlock again.');
                }

                // Keep the picked file even if remembering it fails
                this.fileHandle = fileHandle;
                try {
                    await IndexedDBHelper.storeFileHandle(fileHandle);
                } catch (error) {
                    console.warn('Could not remember file for next time:', error);
                }
                return fileHandle;
            }

            async readDataFile(fileHandle) {
                try {
                    const file = await fileHandle.getFile();
                    const content = await file.text();
                    const match = content.match(/ENCRYPTED_DATA\s*=\s*"([^"]+)"/);
                    if (!match) {
                        throw new Error(`"${file.name}" has no ENCRYPTED_DATA. Pick the data.js saved by the Admin Panel.`);
                    }
                    return match[1];
                } catch (error) {
                    console.error('File read error:', error);
                    throw new Error(error.message || 'Failed to read file');
                }
            }

            showFileSelector() {
                return new Promise((resolve, reject) => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.js';
                    // Resolve when the chooser is closed without a file, so login does not hang
                    input.addEventListener('cancel', () => resolve(null));
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            this.legacyFileName = file.name;
                            try {
                                const content = await file.text();
                                const match = content.match(/ENCRYPTED_DATA\s*=\s*"([^"]+)"/);
                                if (match) {
                                    resolve(match[1]);
                                } else {
                                    reject(new Error(`"${file.name}" has no ENCRYPTED_DATA. Pick the data.js saved by the Admin Panel.`));
                                }
                            } catch (error) {
                                reject(new Error('Failed to read file: ' + error.message));
                            }
                        } else {
                            resolve(null);
                        }
                    };
                    input.click();
                });
            }

            async readData() {
                if (this.isModernBrowser) {
                    // Try the remembered file first (runs on the login click, so permission prompts work)
                    if (this.fileHandle) {
                        const ok = await this.verifyPermission(this.fileHandle);
                        if (ok) {
                            try {
                                return await this.readDataFile(this.fileHandle);
                            } catch (error) {
                                // File was moved, renamed or deleted. Forget it and ask again.
                                console.warn('Remembered file not readable, asking again:', error);
                            }
                        }
                        this.clearFileHandle();
                    }
                    this.fileHandle = await this.selectDataFile();
                    if (!this.fileHandle) return null;
                    return await this.readDataFile(this.fileHandle);
                } else {
                    // Use data already chosen with "Change File", if any
                    if (this.legacyData) {
                        const data = this.legacyData;
                        this.legacyData = null;
                        return data;
                    }
                    return await this.showFileSelector();
                }
            }

            hasFileSelected() {
                return this.fileHandle !== null;
            }

            clearFileHandle() {
                this.fileHandle = null;
                if (this.isModernBrowser) {
                    IndexedDBHelper.clearFileHandle().catch(() => {});
                }
            }
        }

        // ============================================================================
        // AUTO-LOCK MANAGER
        // ============================================================================
        class AutoLockManager {
            constructor(lockCallback, timeoutMs = 300000) { // 5 minutes
                this.lockCallback = lockCallback;
                this.timeoutMs = timeoutMs;
                this.lastActivity = Date.now();
                this.checkInterval = null;
                this.updateCallback = null;
            }

            start(updateCallback) {
                this.updateCallback = updateCallback;
                this.lastActivity = Date.now();

                // Track user activity
                const events = ['mousedown', 'keydown', 'scroll', 'touchstart'];
                events.forEach(event => {
                    document.addEventListener(event, () => this.resetTimer());
                });

                // Check every second
                this.checkInterval = setInterval(() => this.check(), 1000);
            }

            resetTimer() {
                this.lastActivity = Date.now();
            }

            check() {
                const now = Date.now();
                const elapsed = now - this.lastActivity;
                const remaining = Math.max(0, this.timeoutMs - elapsed);

                if (this.updateCallback) {
                    const seconds = Math.floor(remaining / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    this.updateCallback(`${minutes}:${secs.toString().padStart(2, '0')}`);
                }

                if (elapsed > this.timeoutMs) {
                    this.lock();
                }
            }

            lock() {
                this.stop();
                this.lockCallback();
            }

            stop() {
                if (this.checkInterval) {
                    clearInterval(this.checkInterval);
                    this.checkInterval = null;
                }
            }
        }

        // ============================================================================
        // DASHBOARD APPLICATION (Alpine.js)
        // ============================================================================
        function dashboardApp() {
            return {
                isAuthenticated: false,
                passwordInput: '',
                data: { tabs: [] },
                activeTabId: null,
                password: null,
                fileManager: new DataFileManager(),
                autoLockManager: null,
                browserInfo: FileSystemManager.getBrowserInfo(),
                timeUntilLock: '5:00',
                currentFileName: '',

                async init() {
                    await this.fileManager.init();
                    // Update file name if file handle exists
                    if (this.fileManager.fileHandle) {
                        this.currentFileName = this.fileManager.fileHandle.name;
                    }
                },

                async selectDifferentFile() {
                    // Clear current file handle
                    this.fileManager.clearFileHandle();
                    this.currentFileName = '';

                    // Prompt user to select a new file
                    try {
                        if (!this.fileManager.isModernBrowser) {
                            // Standard file chooser: read the file now, use it on Unlock
                            const data = await this.fileManager.showFileSelector();
                            if (data) {
                                this.fileManager.legacyData = data;
                                this.currentFileName = this.fileManager.legacyFileName;
                                this.showNotification('File selected: ' + this.currentFileName, 'success');
                            }
                            return;
                        }
                        const fileHandle = await this.fileManager.selectDataFile();
                        if (fileHandle) {
                            this.currentFileName = fileHandle.name;
                            this.showNotification('File selected: ' + fileHandle.name, 'success');
                        } else if (this.fileManager.pickerFailed) {
                            this.showNotification('Chrome blocked its file picker. Click "Change File" again to use the standard chooser.', 'error');
                        }
                    } catch (error) {
                        this.showNotification(error.message, 'error');
                    }
                },

                async login() {
                    try {
                        if (!this.passwordInput) {
                            this.showNotification('Please enter a password', 'error');
                            return;
                        }

                        // Read encrypted data
                        const encrypted = await this.fileManager.readData();
                        if (!encrypted) {
                            if (this.fileManager.pickerFailed) {
                                this.showNotification('Chrome blocked its file picker. Click "Unlock Dashboard" again to use the standard chooser.', 'error');
                            } else {
                                this.showNotification('No file was picked. Click "Change File" and choose data.js.', 'error');
                            }
                            return;
                        }

                        // Update file name if file handle is now available
                        if (this.fileManager.fileHandle && !this.currentFileName) {
                            this.currentFileName = this.fileManager.fileHandle.name;
                        }

                        // Decrypt data
                        this.data = await EncryptionManager.decrypt(encrypted, this.passwordInput);
                        this.password = this.passwordInput;
                        this.passwordInput = '';

                        // Set authenticated
                        this.isAuthenticated = true;
                        this.activeTabId = this.data.tabs[0]?.id || null;

                        // Start auto-lock
                        this.startAutoLock();

                        this.showNotification('Login successful!', 'success');
                    } catch (error) {
                        if (error.message.includes('password')) {
                            this.showNotification('Wrong password!', 'error');
                        } else {
                            this.showNotification('Error loading data: ' + error.message, 'error');
                        }
                    }
                },

                logout() {
                    // Clear sensitive data
                    this.data = { tabs: [] };
                    this.password = null;
                    this.passwordInput = '';
                    this.isAuthenticated = false;
                    this.activeTabId = null;

                    // Stop auto-lock
                    if (this.autoLockManager) {
                        this.autoLockManager.stop();
                        this.autoLockManager = null;
                    }

                    this.showNotification('Logged out successfully', 'success');
                },

                changeFile() {
                    if (confirm('Change file location? You will be logged out.')) {
                        this.fileManager.clearFileHandle();
                        this.currentFileName = '';
                        this.logout();
                    }
                },

                startAutoLock() {
                    this.autoLockManager = new AutoLockManager(() => {
                        this.logout();
                        this.showNotification('Auto-locked due to inactivity', 'error');
                    });

                    this.autoLockManager.start((timeString) => {
                        this.timeUntilLock = timeString;
                    });
                },

                getColumnType(tab, column) {
                    return tab.columnTypes?.[column] || 'text';
                },

                async copyToClipboard(text, columnName) {
                    if (!text) return;

                    try {
                        await navigator.clipboard.writeText(text);
                        this.showNotification(`Copied ${columnName} to clipboard!`, 'success');
                    } catch (error) {
                        console.error('Copy failed:', error);
                        this.showNotification('Failed to copy to clipboard', 'error');
                    }
                },

                showNotification(message, type = 'success') {
                    const notification = document.createElement('div');
                    notification.className = `notification ${type}`;
                    notification.textContent = message;
                    document.body.appendChild(notification);

                    setTimeout(() => {
                        notification.remove();
                    }, 3000);
                }
            };
        }
    </script>
</body>
</html>
